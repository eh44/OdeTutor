<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Client.styles.css" rel="stylesheet" />
    <script>
        let typingTimer = null;
        // The Promise Queue ensures MathJax only ever processes one request at a time
        let mathJaxPromise = Promise.resolve();

        window.typesetMath = function () {
            if (typingTimer) {
                clearTimeout(typingTimer);
            }

            typingTimer = setTimeout(() => {
                // Chain the new typesetting request to the end of the promise queue
                mathJaxPromise = mathJaxPromise.then(() => {
                    if (window.MathJax) {
                        MathJax.typesetClear();
                        return MathJax.typesetPromise();
                    }
                }).catch(err => console.error('MathJax Error:', err));
            }, 300); // Wait 300ms after the user stops typing
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
